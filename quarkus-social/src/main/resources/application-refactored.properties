# =================================================================
# CONFIGURAÇÕES DA APLICAÇÃO QUARKUS SOCIAL
# =================================================================

# Configurações do servidor
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Configurações de CORS para desenvolvimento
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=*

# =================================================================
# CONFIGURAÇÕES DE LOGGING
# =================================================================

# Nível de log geral
quarkus.log.level=INFO

# Nível de log específico para o nosso pacote
quarkus.log.category."io.github.ESTECHTI".level=DEBUG

# Configurações do console
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.color=true

# =================================================================
# CONFIGURAÇÕES ESPECÍFICAS POR AMBIENTE
# =================================================================

# Configurações para desenvolvimento (perfil dev)
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."io.github.ESTECHTI".level=DEBUG
%dev.quarkus.http.port=8080

# Configurações para testes (perfil test)
%test.quarkus.log.level=WARN
%test.quarkus.log.console.level=WARN
%test.quarkus.http.test-port=8081

# Configurações para produção (perfil prod)
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.level=INFO
%prod.quarkus.http.port=8080

# =================================================================
# CONFIGURAÇÕES DE PERFORMANCE
# =================================================================

# Pool de threads
quarkus.thread-pool.core-threads=2
quarkus.thread-pool.max-threads=8

# =================================================================
# CONFIGURAÇÕES DE SAÚDE E MONITORAMENTO
# =================================================================

# Habilitar health checks
quarkus.smallrye-health.ui.enable=true

# =================================================================
# CONFIGURAÇÕES ESPECÍFICAS DA APLICAÇÃO
# =================================================================

# Nome da aplicação
quarkus.application.name=quarkus-social
quarkus.application.version=2.0

# Banner customizado
quarkus.banner.enabled=true